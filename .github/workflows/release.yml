name: Release

# Pushing a tag such as v3.6.0 builds a signed release APK and publishes it as a GitHub release.
# Running it by hand (workflow_dispatch) builds the same signed APK and keeps it as a downloadable artifact instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Check the tag matches the app version
        run: |
          APP_VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "app version: $APP_VERSION, package version: $PACKAGE_VERSION"
          if [ "$PACKAGE_VERSION" != "$APP_VERSION" ]; then
            echo "package.json and android/app/build.gradle disagree on the version"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "the tag $GITHUB_REF_NAME does not match version $APP_VERSION"; exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Decode the signing key
        env:
          JM_KEYSTORE_BASE64: ${{ secrets.JM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$JM_KEYSTORE_BASE64" ]; then echo "The JM_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$JM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          JM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          JM_KEYSTORE_PASSWORD: ${{ secrets.JM_KEYSTORE_PASSWORD }}
          JM_KEY_ALIAS: ${{ secrets.JM_KEY_ALIAS }}
          JM_KEY_PASSWORD: ${{ secrets.JM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Check the signature and name the APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "JustMoney-${APP_VERSION}.apk"

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "JustMoney-${APP_VERSION}.apk" --title "JustMoney $GITHUB_REF_NAME" --generate-notes

      - name: Keep the APK for a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: justmoney-${{ env.APP_VERSION }}-release-apk
          path: JustMoney-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
